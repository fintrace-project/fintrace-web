name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Format, lint, type-check and build. No image and no release yet (4.2d), no Playwright flows and no
# performance budget yet (4.2f) — each arrives with its task.
jobs:
  build:
    name: fintrace-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: API types match the pinned Core release
        run: |
          npm run generate:api
          git diff --exit-code src/core/api/schema.d.ts

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build
