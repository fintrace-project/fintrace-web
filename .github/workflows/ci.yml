name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Format, lint, type-check, build, the bundle limits — sizes, and first paint on the image as released.
jobs:
  build:
    name: fintrace-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: API types match the pinned Core release
        run: |
          npm run generate:api
          git diff --exit-code src/core/api/schema.d.ts

      - name: Message types match en.yml
        run: |
          npm run generate:messages
          git diff --exit-code src/core/i18n/en.d.yml.ts

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Bundle limits
        run: npm run check:bundle-limits

      # Otherwise a broken Dockerfile or nginx.conf would surface only when a tag is pushed
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fintrace-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: First paint
        run: |
          docker run -d --rm -p 8080:8080 fintrace-web:ci
          npx playwright install --with-deps chromium
          curl -sf --retry 10 --retry-connrefused http://localhost:8080/ > /dev/null
          npm run check:first-paint
