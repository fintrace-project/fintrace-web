name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Format, lint, type-check, build and the image. No Playwright flows and no bundle limits yet
# (4.2f) — they arrive with their task.
jobs:
  build:
    name: fintrace-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: API types match the pinned Core release
        run: |
          npm run generate:api
          git diff --exit-code src/core/api/schema.d.ts

      - name: Message types match en.yml
        run: |
          npm run generate:messages
          git diff --exit-code src/core/i18n/en.d.yml.ts

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      # Otherwise a broken Dockerfile or nginx.conf would surface only when a tag is pushed
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
