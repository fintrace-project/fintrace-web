server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # The build ships .gz beside each text file; gzip covers whatever it missed
    gzip_static on;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Content-hashed names never change, so they are cached for good. A missing one is a 404, never
    # index.html, or a tab left open across a release would load HTML as a script.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html names the current assets, so it is revalidated on every load
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
