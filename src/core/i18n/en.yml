# Every text the UI shows, in English. After an edit, run `npm run generate:messages` to refresh the
# keys' type (en.d.yml.ts). {{name}} is a parameter; <b>…</b> marks emphasis rendered by <Trans>;
# key_one / key_other are the plural forms i18next picks by {{count}}.

