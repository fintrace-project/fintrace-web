    typeToConfirm: Type <b>{{name}}</b> to confirm
    confirm: Delete forever
    deleting: Deleting…

import:
  title: Import history
  importing: Importing…
  importingText: Reading the file and writing it into {{workspace}}. This can take a minute; keep this page open.
  intro: 'Everything in the file arrives in one step: accounts, categories, operations, transfers and balances. If anything in it is refused, nothing is imported and the workspace stays empty.'
  from: Import from
  drop: '<desktop>Drop the file here, or </desktop><u>choose a file</u>'
  fileHint: '{{file}}, up to {{size}}'
  chosen: '{{size}} · choose another'
  tooBig: This file is {{size}}; {{source}} imports accept up to {{max}}.
  submit: Import
  running:
    title: An import is running
    text: Another import into this workspace has not finished yet. Come back in a minute.
  closed:
    title: Import is closed
    text: History can be imported only into a new, empty workspace, and {{workspace}} is no longer new. To import history, create a workspace for it.
    action: New workspace
  done: Imported into {{workspace}}
  counts:
    accounts: Accounts
    categories: Categories
    operations: Operations
    transfers: Transfers
    anchors: Balance anchors
  open: Open the workspace
  failed: Nothing was imported
  refused: The file was refused.
  stillEmpty: '{{workspace}} is still empty, so you can fix the file and try again.'
  affected: '{{entities}} affected'
  affectedField: '{{entities}} affected · field {{field}}'
  more_one: And {{count, number}} more problem.
  more_other: And {{count, number}} more problems.
  retry: Choose another file
  notes: Notes from the importer
  error: Error
  warning: Warning
  diagnostic: '{{label}}: {{count, number}}'

